<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Helvetica, Arial, sans-serif">
  <!-- opaque background so the figure reads the same in light and dark GitHub themes -->
  <rect x="0" y="0" width="960" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker>
  </defs>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1b1f23">Two worked examples, kept apart on purpose</text>

  <!-- Tsawwassen track -->
  <rect x="20" y="48" width="920" height="96" rx="10" fill="#f6f1e4" stroke="#8a7a55" stroke-width="1.3"/>
  <text x="36" y="72" font-size="13.5" font-weight="bold" fill="#8a7a55">Tsawwassen · constructed for teaching</text>
  <text x="36" y="90" font-size="11.5" fill="#57606a">a real place and a real run of the sampling tool,</text>
  <text x="36" y="105" font-size="11.5" fill="#57606a">but no real team, cores or records</text>
  <g font-size="12" fill="#1b1f23">
    <rect x="370" y="66" width="190" height="56" rx="7" fill="#ffffff" stroke="#8a7a55" stroke-width="1.2"/>
    <text x="465" y="89" text-anchor="middle" font-weight="bold">Part 2 · Plan</text>
    <text x="465" y="107" text-anchor="middle" font-size="11" fill="#57606a">boundary, zones, 33 cores</text>
    <rect x="600" y="66" width="190" height="56" rx="7" fill="#ffffff" stroke="#8a7a55" stroke-width="1.2"/>
    <text x="695" y="89" text-anchor="middle" font-weight="bold">Part 3 · Field practice</text>
    <text x="695" y="107" text-anchor="middle" font-size="11" fill="#57606a">filled-in sheet, WWF-01-A</text>
  </g>
  <line x1="560" y1="94" x2="598" y2="94" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- switch marker -->
  <text x="800" y="160" font-size="12" font-weight="bold" fill="#b5402a">the example switches here</text>
  <path d="M790 122 L790 172" stroke="#b5402a" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- Cowichan track -->
  <rect x="20" y="180" width="920" height="104" rx="10" fill="#e8f3ec" stroke="#1f7a4d" stroke-width="1.3"/>
  <text x="36" y="204" font-size="13.5" font-weight="bold" fill="#1f7a4d">Cowichan · published measurements</text>
  <text x="36" y="222" font-size="11.5" fill="#57606a">three eelgrass cores, Douglas et al. 2022;</text>
  <text x="36" y="237" font-size="11.5" fill="#57606a">dry weights reconstructed, lab details illustrative,</text>
  <text x="36" y="252" font-size="11.5" fill="#57606a">Option B area hypothetical</text>
  <g font-size="12" fill="#1b1f23">
    <rect x="370" y="200" width="130" height="64" rx="7" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.2"/>
    <text x="435" y="226" text-anchor="middle" font-weight="bold">Lab results</text>
    <text x="435" y="244" text-anchor="middle" font-size="11" fill="#57606a">mock lab sheet</text>
    <rect x="520" y="200" width="130" height="64" rx="7" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.2"/>
    <text x="585" y="226" text-anchor="middle" font-weight="bold">Workbook</text>
    <text x="585" y="244" text-anchor="middle" font-size="11" fill="#57606a">checked core stocks</text>
    <rect x="670" y="200" width="120" height="64" rx="7" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.2"/>
    <text x="730" y="226" text-anchor="middle" font-weight="bold">Option A · B</text>
    <text x="730" y="244" text-anchor="middle" font-size="11" fill="#57606a">compare · area</text>
    <rect x="810" y="200" width="110" height="64" rx="7" fill="#0f4c66" stroke="#0f4c66" stroke-width="1.2"/>
    <text x="865" y="236" text-anchor="middle" font-weight="bold" fill="#ffffff">Report</text>
  </g>
  <g stroke="#57606a" stroke-width="1.6" marker-end="url(#a)">
    <line x1="500" y1="232" x2="518" y2="232"/><line x1="650" y1="232" x2="668" y2="232"/><line x1="790" y1="232" x2="808" y2="232"/>
  </g>
</svg>
