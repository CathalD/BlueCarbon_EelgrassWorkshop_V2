<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" width="980" height="250" font-family="Helvetica, Arial, sans-serif">
  <!-- opaque background so the figure reads the same in light and dark GitHub themes -->
  <rect x="0" y="0" width="980" height="250" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1b1f23">From a question to a report</text>
  <text x="20" y="48" font-size="12.5" fill="#57606a">One shared path through the field and the lab, then two ways to use the results</text>

  <!-- stage boxes -->
  <g font-size="12" fill="#1b1f23">
    <rect x="20" y="80" width="108" height="78" rx="8" fill="#eaf7fb" stroke="#0f4c66" stroke-width="1.4"/>
    <text x="74" y="104" text-anchor="middle" font-weight="bold">Question</text>
    <text x="74" y="122" text-anchor="middle" font-size="11" fill="#57606a">compare cores,</text>
    <text x="74" y="137" text-anchor="middle" font-size="11" fill="#57606a">or estimate an area?</text>
    <text x="74" y="176" text-anchor="middle" font-size="10.5" fill="#0f4c66">Part 1 · Part 2</text>

    <rect x="150" y="80" width="108" height="78" rx="8" fill="#eaf7fb" stroke="#0f4c66" stroke-width="1.4"/>
    <text x="204" y="104" text-anchor="middle" font-weight="bold">Sampling plan</text>
    <text x="204" y="122" text-anchor="middle" font-size="11" fill="#57606a">boundary, strata,</text>
    <text x="204" y="137" text-anchor="middle" font-size="11" fill="#57606a">depth, cores, places</text>
    <text x="204" y="176" text-anchor="middle" font-size="10.5" fill="#0f4c66">Part 2</text>

    <rect x="280" y="80" width="108" height="78" rx="8" fill="#f6f1e4" stroke="#8a7a55" stroke-width="1.4"/>
    <text x="334" y="104" text-anchor="middle" font-weight="bold">Field sheet</text>
    <text x="334" y="122" text-anchor="middle" font-size="11" fill="#57606a">cores, slices and</text>
    <text x="334" y="137" text-anchor="middle" font-size="11" fill="#57606a">labelled bags</text>
    <text x="334" y="176" text-anchor="middle" font-size="10.5" fill="#8a7a55">Part 3</text>

    <rect x="410" y="80" width="108" height="78" rx="8" fill="#f6f1e4" stroke="#8a7a55" stroke-width="1.4"/>
    <text x="464" y="104" text-anchor="middle" font-weight="bold">Lab results</text>
    <text x="464" y="122" text-anchor="middle" font-size="11" fill="#57606a">dry mass, organic</text>
    <text x="464" y="137" text-anchor="middle" font-size="11" fill="#57606a">carbon or LOI</text>
    <text x="464" y="176" text-anchor="middle" font-size="10.5" fill="#8a7a55">Part 4 · Steps 1–2</text>

    <rect x="540" y="80" width="118" height="78" rx="8" fill="#e8f3ec" stroke="#1f7a4d" stroke-width="1.4"/>
    <text x="599" y="104" text-anchor="middle" font-weight="bold">Checked workbook</text>
    <text x="599" y="122" text-anchor="middle" font-size="11" fill="#57606a">stocks by depth</text>
    <text x="599" y="137" text-anchor="middle" font-size="11" fill="#57606a">increment, per core</text>
    <text x="599" y="176" text-anchor="middle" font-size="10.5" fill="#1f7a4d">Part 4 · Steps 3–4</text>

    <rect x="690" y="64" width="140" height="48" rx="8" fill="#e8f3ec" stroke="#1f7a4d" stroke-width="1.4"/>
    <text x="760" y="85" text-anchor="middle" font-weight="bold">A · Compare cores</text>
    <text x="760" y="101" text-anchor="middle" font-size="11" fill="#57606a">with published eelgrass</text>

    <rect x="690" y="128" width="140" height="48" rx="8" fill="#e8f3ec" stroke="#1f7a4d" stroke-width="1.4"/>
    <text x="760" y="149" text-anchor="middle" font-weight="bold">B · Estimate an area</text>
    <text x="760" y="165" text-anchor="middle" font-size="11" fill="#57606a">mean and total</text>

    <rect x="860" y="80" width="100" height="78" rx="8" fill="#0f4c66" stroke="#0f4c66" stroke-width="1.4"/>
    <text x="910" y="112" text-anchor="middle" font-weight="bold" fill="#ffffff">Report</text>
    <text x="910" y="130" text-anchor="middle" font-size="11" fill="#dff2f8">with depth and</text>
    <text x="910" y="144" text-anchor="middle" font-size="11" fill="#dff2f8">limits</text>
    <text x="910" y="176" text-anchor="middle" font-size="10.5" fill="#0f4c66">Part 4 · Step 5</text>
  </g>

  <!-- arrows -->
  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <line x1="128" y1="119" x2="148" y2="119"/>
    <line x1="258" y1="119" x2="278" y2="119"/>
    <line x1="388" y1="119" x2="408" y2="119"/>
    <line x1="518" y1="119" x2="538" y2="119"/>
    <path d="M658 119 C672 119 674 88 688 88"/>
    <path d="M658 119 C672 119 674 152 688 152"/>
    <path d="M830 88 C844 88 846 112 858 112"/>
    <path d="M830 152 C844 152 846 128 858 128"/>
  </g>

  <!-- shared-path brace -->
  <path d="M20 205 L20 212 L658 212 L658 205" stroke="#1f7a4d" stroke-width="1.4" fill="none"/>
  <text x="339" y="232" text-anchor="middle" font-size="11.5" fill="#1f7a4d">the same for every project</text>
  <path d="M690 205 L690 212 L830 212 L830 205" stroke="#0f4c66" stroke-width="1.4" fill="none"/>
  <text x="760" y="232" text-anchor="middle" font-size="11.5" fill="#0f4c66">depends on your question</text>
</svg>
